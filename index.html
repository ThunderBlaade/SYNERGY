<body>
<button id="backbtn" class="back" data-a="goback" hidden aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><div id="sky" aria-hidden="true"><div class="sgrad"></div><div class="stw"><i></i><i></i></div><div id="sun"><span class="sg"></span><span class="sd"></span></div><div id="moon"></div><div id="fxs"></div></div><div id="tbar" aria-hidden="true"><span>SYNERGY</span></div><div id="app"></div><div id="fx" aria-hidden="true"></div><nav><div class="in" id="nav"></div></nav><div class="toast" id="toast" role="status"></div>
<script>
/* ===== One central configuration (provisional values from Part 2; every one is easy to change) ===== */
const CFG={v:'cfg-1',base:[100,50,0],pr:75,prCap:2,prMin:1.01,lvlBase:250,lvlStep:50,seasonDays:42,seasonStart:[2026,10,16],backdateHours:48};
const TITLES=[[1,'Initiate'],[5,'Contender'],[10,'Established'],[15,'Advanced'],[20,'Elite'],[30,'Dominant'],[40,'Master'],[50,'Icon']];
const CATS={strength:['Strength','A'],running:['Running','B'],walking:['Walking','B'],cycling:['Cycling','B'],swimming:['Swimming','B'],sports:['Sports','C'],mobility:['Mobility','C'],cardio:['Cardio','B'],other:['Other','C']};
/* Qualifying thresholds are MY PROPOSAL (Part 3 did not define them). */
const QUAL={strength:'4 completed sets',running:'15 minutes',walking:'15 minutes',cycling:'15 minutes',swimming:'15 minutes',cardio:'15 minutes',mobility:'10 minutes',sports:'20 minutes',other:'20 minutes'};
const EX=`Bench press|Chest|Barbell;Incline bench press|Chest|Barbell;Dumbbell bench press|Chest|Dumbbells;Incline dumbbell press|Chest|Dumbbells;Chest fly|Chest|Dumbbells;Push-ups|Chest|Bodyweight|r;Bent-over row|Back|Barbell;Dumbbell row|Back|Dumbbells;Barbell row|Back|Barbell;Lat pulldown|Back|Cable;Pull-ups|Back|Bodyweight|r;Seated row|Back|Cable;Shoulder press|Shoulders|Barbell;Dumbbell shoulder press|Shoulders|Dumbbells;Lateral raise|Shoulders|Dumbbells;Front raise|Shoulders|Dumbbells;Rear delt fly|Shoulders|Dumbbells;Upright row|Shoulders|Barbell;Bicep curl|Arms|Dumbbells;Hammer curl|Arms|Dumbbells;Preacher curl|Arms|Barbell;Tricep extension|Arms|Dumbbells;Overhead tricep extension|Arms|Dumbbells;Tricep pushdown|Arms|Cable;Squat|Legs|Barbell;Goblet squat|Legs|Dumbbells;Romanian deadlift|Legs|Barbell;Conventional deadlift|Legs|Barbell;Lunges|Legs|Dumbbells;Leg extension|Legs|Machine;Hamstring curl|Legs|Machine;Calf raise|Legs|Machine;Plank|Core|Bodyweight|t;Crunch|Core|Bodyweight|r;Leg raise|Core|Bodyweight|r;Reverse crunch|Core|Bodyweight|r;Russian twist|Core|Bodyweight|r;Cable crunch|Core|Cable`.split(';').map(s=>{const[n,mu,eq,m]=s.split('|');return{id:n.toLowerCase().replace(/\W+/g,'-'),n,mu,eq,m:m||'wr'}});
const MUS=['Chest','Back','Shoulders','Arms','Legs','Core'];
const ICON={home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',play:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/>',conn:'<circle cx="6" cy="7" r="2.5"/><circle cx="18" cy="7" r="2.5"/><circle cx="12" cy="18" r="2.5"/><path d="M8 8.5l3 7M16 8.5l-3 7M8.5 7h7"/>',rank:'<path d="M5 21V12M12 21V4M19 21v-6"/>',astral:'<path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/>',me:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
strength:'<path d="M6 8v8M3 10v4M18 8v8M21 10v4M6 12h12"/>',running:'<circle cx="14" cy="5" r="2"/><path d="M10 21l2-6-3-3 3-4 3 3h3M8 11l-2 3"/>',walking:'<circle cx="12" cy="5" r="2"/><path d="M12 8l-1 6-3 7M12 8l3 5 2 1M11 14l3 7"/>',cycling:'<circle cx="6" cy="16" r="3.5"/><circle cx="18" cy="16" r="3.5"/><path d="M6 16l4-8h5l3 8M10 8l5 8"/>',swimming:'<path d="M2 18c2 0 2-1.5 4-1.5S8 18 10 18s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M8 13l4-4 3 2"/><circle cx="17" cy="6" r="1.5"/>',sports:'<path d="M8 4h8v5a4 4 0 0 1-8 0zM12 13v4M8 20h8M8 6H5v2a3 3 0 0 0 3 3M16 6h3v2a3 3 0 0 1-3 3"/>',mobility:'<circle cx="12" cy="4.5" r="2"/><path d="M12 7v6M5 10l7 2 7-2M9 21l3-8 3 8"/>',cardio:'<path d="M3 12h4l2-5 4 10 2-5h6"/>',other:'<path d="M12 5v14M5 12h14"/>'};
const ic=k=>`<svg viewBox="0 0 24 24" aria-hidden="true" width="24" height="24">${ICON[k]}</svg>`;

/* ===== State (stored on this device only) ===== */
const DEF=()=>({name:'',theme:'auto',v2:1,v3:1,loc:{mode:'auto',region:null,fx:{d0:330,d1:990},share:false},accent:'#7B7EEA',units:'metric',glass:true,glow:true,size:100,reduce:false,hide:[],ledger:[],workouts:[],custom:[],tpl:[],active:null,rest:null,seq:1});
let S=DEF();try{const r=localStorage.getItem('synergy');if(r)S={...DEF(),...JSON.parse(r)}}catch(e){}
if(!S.v3){S.theme='system';S.v2=1;S.v3=1}if(S.theme==='auto'||!S.theme)S.theme='system';
const save=()=>{try{localStorage.setItem('synergy',JSON.stringify(S))}catch(e){}if(typeof lkSync==='function'){try{lkSync()}catch(e){}}};
const NAVT=((performance.getEntriesByType&&performance.getEntriesByType('navigation')[0])||{}).type;
let tab=(NAVT==='reload'||NAVT==='back_forward')&&['home','play','conn','rank','astral','me'].includes(S.lastTab)?S.lastTab:'home',sub=null,shown={},confirmReset=false;
const $=s=>document.querySelector(s);
const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dk=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const wkStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const seasonNo=t=>Math.max(1,Math.floor((t-new Date(...CFG.seasonStart).getTime())/(CFG.seasonDays*864e5))+1);
const fdate=t=>new Date(t).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
const fdur=s=>{s=Math.round(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(x).padStart(2,'0')}`:`${m}:${String(x).padStart(2,'0')}`};
const mins=s=>Math.round(s/60)+' min';
/* Units: weights stored as whole grams, distances as metres; conversion is display-only. */
const imp=()=>S.units==='imperial';
const wDisp=g=>g?String(Math.round((imp()?g/453.592:g/1000)*10)/10):'';
const wParse=v=>Math.round((parseFloat(v)||0)*(imp()?453.592:1000));
const fw=g=>wDisp(g)+(imp()?' lb':' kg');
const dDisp=m=>m?String(Math.round((imp()?m/1609.344:m/1000)*100)/100):'';
const dParse=v=>Math.round((parseFloat(v)||0)*(imp()?1609.344:1000));
const fd=m=>dDisp(m)+(imp()?' mi':' km');
const pace=(sec,m)=>{if(!m||!sec)return '–';const p=sec/(m/(imp()?1609.344:1000));return `${Math.floor(p/60)}:${String(Math.round(p%60)).padStart(2,'0')} min/${imp()?'mi':'km'}`};

/* ===== The economy: ONE source of truth. Append-only ledger; levels derive from it. ===== */
const revd=()=>new Set(S.ledger.filter(e=>e.rev).map(e=>e.rev));
const live=(e,r=revd())=>!e.rev&&!r.has(e.id);
const total=()=>S.ledger.reduce((s,e)=>s+e.amt,0);
const sumWhere=f=>S.ledger.filter(f).reduce((s,e)=>s+e.amt,0);
function addXP(key,amt,cat,why,ref,ts){if(S.ledger.some(e=>e.key===key))return 0;S.ledger.push({id:S.seq++,ts,day:dk(ts),season:seasonNo(ts),amt,cat,why,ref,key,cfg:CFG.v});return amt}
function lvl(xp){let L=1,r=xp,need=CFG.lvlBase;while(r>=need){r-=need;L++;need=CFG.lvlBase+CFG.lvlStep*(L-1)}return{L,into:r,need,left:need-r,pct:Math.round(r/need*100)}}
const ttl=L=>[...TITLES].reverse().find(t=>L>=t[0])[1];
const exLib=()=>[...EX,...S.custom];
const exName=id=>exLib().find(e=>e.id===id)?.n||'Exercise';
const doneSets=w=>w.exs?w.exs.reduce((n,x)=>n+x.sets.filter(s=>s.done).length,0):(w.setsN||0);
function qualifies(w){if(w.cat==='strength')return doneSets(w)>=4;const m=w.dur/60;return w.cat==='mobility'?m>=10:(w.cat==='sports'||w.cat==='other')?m>=20:m>=15}
const E1=(g,r)=>g*(1+r/30); /* Epley estimate; only used for 1 to 12 reps */
function best(id,list){const b={e:0,r:0,t:0};list.forEach(w=>(w.exs||[]).filter(x=>x.id===id).forEach(x=>x.sets.filter(s=>s.done).forEach(s=>{if(s.t)b.t=Math.max(b.t,s.t);else if(s.w>0&&s.r>0&&s.r<=12)b.e=Math.max(b.e,E1(s.w,s.r));else if(!s.w&&s.r>0)b.r=Math.max(b.r,s.r)})));return b}
function findPRs(w){const old=S.workouts.filter(o=>o.id!==w.id&&o.end<=w.end),out=[];
 (w.exs||[]).forEach(x=>{const p=best(x.id,old),c=best(x.id,[w]);if(['e','t','r'].some(k=>p[k]>0&&(k==='r'?c[k]>p[k]:c[k]>p[k]*CFG.prMin)))out.push({key:x.id,label:exName(x.id)})});
 if(w.dist){const pd=Math.max(0,...old.filter(o=>o.cat===w.cat).map(o=>o.dist||0));if(pd>0&&w.dist>pd*CFG.prMin)out.push({key:w.cat,label:'Longest '+CATS[w.cat][0].toLowerCase()+' distance'})}
 return out}
function processWorkout(w){const out={lines:[],pr:[],note:''};
 if(!qualifies(w)){out.note=`Saved. It didn’t reach the ${QUAL[w.cat]} needed to earn Sparks.`;return out}
 if(Date.now()-w.end>CFG.backdateHours*36e5){out.note=`Saved. Workouts logged more than ${CFG.backdateHours} hours after they happened don’t earn Sparks.`;return out}
 const r=revd(),day=dk(w.start),n=S.ledger.filter(e=>e.cat==='Workout completion'&&e.day===day&&live(e,r)&&e.ref!==w.id).length,b=CFG.base[Math.min(n,CFG.base.length-1)];
 if(b){addXP(`w:${w.id}:base`,b,'Workout completion',n?'Second workout of the day':'First workout of the day',w.id,w.start);out.lines.push(['Workout',b])}else out.note='Logged. Only the first two workouts each day earn base Sparks.';
 out.pr=findPRs(w).slice(0,CFG.prCap);out.pr.forEach(p=>{addXP(`w:${w.id}:pr:${p.key}`,CFG.pr,'Personal record','Record: '+p.label,w.id,w.start);out.lines.push(['Record: '+p.label,CFG.pr])});return out}
function deleteWorkout(id){const r=revd();S.ledger.filter(e=>e.ref===id&&live(e,r)).forEach(e=>S.ledger.push({id:S.seq++,ts:Date.now(),day:dk(Date.now()),season:seasonNo(Date.now()),amt:-e.amt,cat:'Reversal',why:'Reversed: '+e.why,ref:id,rev:e.id,key:'rev:'+e.id,cfg:CFG.v}));S.workouts=S.workouts.filter(w=>w.id!==id);try{socRetract(id);setTimeout(socSyncStat,0)}catch(e){}}
function achs(){const w=S.workouts.length,L=lvl(total()).L,r=revd(),prs=S.ledger.filter(e=>e.cat==='Personal record'&&live(e,r)).length,wk={};S.workouts.forEach(x=>{const k=wkStart(x.end);wk[k]=1});const aw=Object.keys(wk).length;
 const a=(n,c,g)=>({n,ok:c>=g,p:`${Math.min(c,g)}/${g}`});
 return[a('First workout',w,1),a('First personal record',prs,1),a('Three active weeks',aw,3),a('Five personal records',prs,5),a('Level 5',L,5),a('Level 10',L,10),a('Fifty workouts',w,50),a('Hundred workouts',w,100)]}

/* ===== Views ===== */
const bar=(i,d=0)=>`<div class="bar" role="progressbar" aria-valuenow="${i.pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${i.pct}%"></i></div>`;
const num=(k,v)=>`<span data-n="${k}" data-v="${v}">${shown[k]??v}</span>`;
const txRows=(n)=>{const e=[...S.ledger].reverse().slice(0,n);return e.length?`<ul class="list">${e.map(x=>`<li><div class="t"><b>${esc(x.why)}</b><span class="mu sm">${fdate(x.ts)} · ${esc(x.cat)}</span></div><span class="xp ${x.amt<0?'neg':''}">${x.amt>0?'+':''}${x.amt}</span></li>`).join('')}</ul>`:'<p class="mu sm" style="margin:0">No Sparks yet. Your first qualifying workout earns 100.</p>'};
const swp=(h,a,c)=>`<div class="swp ${c||''}"><button class="swp-del" ${a} aria-label="Delete">Delete</button><div class="swp-in">${h}</div></div>`;
const GI={health:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',appearance:'<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/>',home:'<path d="M4 11l8-7 8 7v9H4z"/>',units:'<path d="M4 17L17 4l3 3L7 20z"/><path d="M9 9l2 2M12 6l2 2M6 12l2 2"/>',account:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1-4 15-4 16 0"/>',ach:'<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',scoring:'<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h4"/>',data:'<path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13"/>',loc:'<path d="M12 21s7-6 7-11a7 7 0 0 0-14 0c0 5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',perm:'<path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/>',social:'<circle cx="9" cy="8" r="3.5"/><path d="M3 19c.5-3.500 11.500-3.500 12 0M16 5a3.500 3.500 0 0 1 0 6.500M17 14c3 .5 4 2.500 4 5"/>'};
const lum=h=>{const n=parseInt(h.slice(1),16),f=c=>{c/=255;return c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4)};return .2126*f(n>>16)+.7152*f(n>>8&255)+.0722*f(n&255)};
function applyLook(){const r=document.documentElement;r.setAttribute('data-glass',S.glass?'on':'off');r.setAttribute('data-glow',S.glow?'on':'off');if(S.reduce)r.setAttribute('data-rm','');else r.removeAttribute('data-rm');
 r.style.setProperty('--onac',/^#[0-9a-f]{6}$/i.test(S.accent)&&lum(S.accent)>.45?'#111':'#fff');const a=$('#app');if(a)a.style.zoom=S.size===100?'':S.size/100;
 const bk=$('#app .bk'),b=$('#backbtn');if(b){b.hidden=!bk;if(bk)b.setAttribute('aria-label',bk.textContent.trim()==='Back'?'Back':bk.textContent.trim())}}
const tgl=(k,on,l)=>`<div class="ir"><span>${l}</span><button class="tg" role="switch" aria-checked="${on}" aria-label="${l}" data-tg="${k}"></button></div>`;
const irow=(p,l,v,c)=>`<button class="ir" data-set="${p}"><span class="ib" style="background:${c}"><svg viewBox="0 0 24 24">${GI[p]}</svg></span><span>${l}</span>${v?`<span class="v">${v}</span>`:''}<span class="ch">›</span></button>`;
const SETT={appearance:'Appearance',home:'Home screen',units:'Units',account:'Account',ach:'Achievements',scoring:'How scoring works',health:'Health data',data:'Your data',social:'Social & privacy',loc:'Location & region',perm:'Permissions'};
const COLS=[['#7B7EEA','Nebula'],['#6FA8E6','Ion'],['#58C2B0','Aurora'],['#E39A6E','Nova'],['#D882A8','Pulsar'],['#E3BF6C','Solar']];
function setPage(){const p=sub.p,I=lvl(total()),A=achs();let b='';
 if(p==='appearance')b=`<h2>Theme</h2><div class="seg s4" role="group" aria-label="Theme">${['system','light','dark'].map(t=>`<button data-th="${t}" aria-pressed="${S.theme===t}">${THL[t]}</button>`).join('')}</div><p class="mu sm" style="margin:8px 0 0">System follows your phone. The Astral page keeps its own look and always follows the real sky.</p>
 <h2>Look</h2><div class="grp">${tgl('glow',S.glow,'Soft colour wash')}${tgl('reduce',S.reduce,'Reduce motion')}</div>
 <h2>Text size</h2><div class="seg" role="group" aria-label="Text size">${[[90,'Small'],[100,'Default'],[112,'Large'],[125,'Larger']].map(z=>`<button data-sz="${z[0]}" aria-pressed="${S.size===z[0]}">${z[1]}</button>`).join('')}</div>
 <div style="margin-top:22px"><button class="btn g" data-a="resetlook" style="width:100%">Reset appearance</button></div>`;
